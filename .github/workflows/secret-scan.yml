name: secret-scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan PR diff for secrets and personal info
        run: >
          python3 scripts/scan_secrets.py
          --range "${{ github.event.pull_request.base.sha }}...HEAD"
